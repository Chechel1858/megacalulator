name: Сборка и тесты

on:
  push:
  pull_request:

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Настройка CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Сборка
        run: cmake --build build --config Release

      - name: Модульные тесты
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Проверка работы сервера
        if: runner.os == 'Linux'
        run: |
          ./build/water_server --port 8080 --data /tmp/orders.json &
          sleep 1
          curl --fail -s http://localhost:8080/api/health
          curl --fail -s http://localhost:8080/ > /dev/null
          curl --fail -s -X POST http://localhost:8080/api/orders \
            -H 'Content-Type: application/json' \
            -d "{\"customer_name\":\"Тест\",\"phone\":\"+79001234567\",\"address\":\"ул. Тестовая, 1\",\"delivery_date\":\"$(date +%F)\",\"items\":[{\"product_id\":1,\"quantity\":2}]}"
          curl --fail -s http://localhost:8080/api/orders/1

  # Способы сборки на Windows без CMake: проект Visual Studio и build.bat.
  windows-no-cmake:
    strategy:
      fail-fast: false
      matrix:
        method: [visual-studio, build-bat-msvc, build-bat-gcc]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        if: matrix.method == 'visual-studio'

      - name: Сборка проекта Visual Studio
        if: matrix.method == 'visual-studio'
        run: msbuild WaterOrderSystem.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Сборка build.bat (Visual Studio)
        if: matrix.method == 'build-bat-msvc'
        shell: cmd
        run: call build.bat msvc

      - name: Сборка build.bat (MinGW)
        if: matrix.method == 'build-bat-gcc'
        shell: cmd
        run: call build.bat gcc

      - name: Проверка работы сервера
        shell: pwsh
        run: |
          $exe = if (Test-Path bin\Release\water_server.exe) { 'bin\Release\water_server.exe' } else { 'water_server.exe' }
          $server = Start-Process -FilePath $exe -ArgumentList '--port', '8080', '--data', 'orders-ci.json' -PassThru
          Start-Sleep -Seconds 2
          $health = Invoke-RestMethod http://localhost:8080/api/health
          if ($health.status -ne 'ok') { throw 'Сервер не отвечает' }
          Invoke-WebRequest http://localhost:8080/ -UseBasicParsing | Out-Null
          $body = @{
            customer_name = 'Тест'; phone = '+79001234567'; address = 'ул. Тестовая, 1'
            delivery_date = (Get-Date -Format 'yyyy-MM-dd'); items = @(@{ product_id = 1; quantity = 2 })
          } | ConvertTo-Json
          $order = Invoke-RestMethod http://localhost:8080/api/orders -Method Post `
            -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          if ($order.total -ne 700) { throw "Неверная сумма заказа: $($order.total)" }
          # Второй заказ проверяет, что файл заказов перезаписывается на Windows.
          $order = Invoke-RestMethod http://localhost:8080/api/orders -Method Post `
            -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          if ($order.id -ne 2) { throw "Неверный номер заказа: $($order.id)" }
          Stop-Process $server
